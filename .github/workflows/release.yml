name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            git fetch --tags --force
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TAG_NAME="v0.1.0"
            else
              VERSION="${LATEST_TAG#v}"
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)
              NEW_PATCH=$((PATCH + 1))
              TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Determined release tag: ${TAG_NAME}"

  build:
    name: Build Binary
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            goarm: ''
            output_name: tsub-linux-arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            output_name: tsub-linux-armv7
          - goos: linux
            goarch: amd64
            goarm: ''
            output_name: tsub-linux-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/${{ matrix.output_name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              gh release create "$TAG_NAME" dist/* \
                --repo "${{ github.repository }}" \
                --title "$TAG_NAME" \
                --generate-notes \
                --clobber
            else
              gh release create "$TAG_NAME" dist/* \
                --repo "${{ github.repository }}" \
                --target "${{ github.sha }}" \
                --title "$TAG_NAME" \
                --generate-notes \
                --clobber
            fi
          fi
